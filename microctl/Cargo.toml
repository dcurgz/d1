[package]
name = "microctl"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "microctl"
path = "src/microctl/main.rs"

[[bin]]
name = "microctld"
path = "src/microctld/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
